# Пример reverse-proxy: nginx → luder-server (http://127.0.0.1:3000)
# Терминируем TLS, отдаём статику лендинга с сжатием, файлы — без буферизации.
# В luder-server/.env включи TRUST_PROXY=1.

server {
    listen 443 ssl http2;
    server_name aspire-5.example.com;   # ← твой домен

    ssl_certificate     /etc/letsencrypt/live/aspire-5.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aspire-5.example.com/privkey.pem;

    # Заголовки безопасности
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 32k;   # /register не бывает больше

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Инсталляторы ~100MB: без буферизации и таймаутов на запись
    location ~ ^/(download|luder\.exe) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}

# HTTP → HTTPS
server {
    listen 80;
    server_name aspire-5.example.com;
    return 301 https://$host$request_uri;
}
