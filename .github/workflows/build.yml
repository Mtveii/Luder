name: build-windows
on:
  push:
    paths:
      - 'luder-program/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: luder-program
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: luder-program/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Проверка установки и удаления
        run: node test/test-uninstaller.js
      - uses: actions/upload-artifact@v4
        with:
          name: luder-windows-installer
          path: luder-program/dist/Luder-Setup-*.exe
