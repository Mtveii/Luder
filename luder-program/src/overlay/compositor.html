<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
  window.compositorAPI.onComposite(async ({ pieces, width, height }) => {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');

    for (const piece of pieces) {
      const img = new Image();
      await new Promise((resolve) => {
        img.onload = resolve;
        img.src = piece.dataUrl;
      });
      ctx.drawImage(img, piece.x, piece.y, piece.width, piece.height);
    }

    window.compositorAPI.sendResult(canvas.toDataURL('image/png'));
  });
</script>
</body>
</html>
