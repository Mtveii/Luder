<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="tabs">
    <button class="tab-btn active" data-tab="general">Основное</button>
    <button class="tab-btn" data-tab="themes">Темы</button>
    <button class="tab-btn" data-tab="hotkeys">Quick Hotkeys</button>
  </div>

  <!-- Таб: Основное -->
  <section id="tab-general" class="tab-panel active">
    <label>Хоткей для выделения
      <input id="hotkey" type="text" placeholder="Ctrl+Alt+Space" />
    </label>

    <label>Провайдер
      <select id="provider">
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="openrouter">OpenRouter</option>
        <option value="groq">Groq</option>
        <option value="mistral">Mistral</option>
      </select>
    </label>

    <label>Модель
      <select id="model"></select>
    </label>

    <!-- API ключ -->
    <div id="apikey-section">
      <label>API ключ
        <input id="apiKey" type="password" placeholder="sk-..." />
      </label>
    </div>

    <label><input id="alwaysOnTop" type="checkbox" /> Окно чата всегда поверх других</label>
    <label><input id="voiceInput" type="checkbox" /> Голосовой ввод</label>
    <button id="save">Сохранить</button>
    <button id="check-update">Проверить обновления</button>
    <div id="status"></div>
  </section>

  <!-- Таб: Темы -->
  <section id="tab-themes" class="tab-panel">
    <div id="themes-grid"></div>
  </section>

  <!-- Таб: Quick Hotkeys -->
  <section id="tab-hotkeys" class="tab-panel">
    <div id="hotkeys-list"></div>
    <div class="hotkey-form">
      <input id="hk-combo" placeholder="Комбинация, напр. Alt+1" />
      <input id="hk-prompt" placeholder="Фиксированный промпт" />
      <button id="hk-add">Добавить</button>
    </div>
    <div id="hk-hint">До 10 привязок</div>
  </section>

  <script src="../shared/theme.js"></script>
  <script src="settings.js"></script>
</body>
</html>
